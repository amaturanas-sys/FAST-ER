name: Build Android APK (FAST-E.R.)

# Compila el APK Android de FAST-E.R. (Capacitor) y lo publica como artefacto
# descargable. Ejecútalo manualmente desde la pestaña Actions → Run workflow.
on:
  workflow_dispatch:
  push:
    tags:
      - 'android-v*'
    branches:
      - 'apk-build'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build web assets (www/)
        run: npm run build:www

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icons & splash
        run: npx capacitor-assets generate --assetPath app-resources --android

      - name: Capacitor sync
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FAST-ER.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FAST-ER-apk
          path: FAST-ER.apk
          if-no-files-found: error

      - name: Publicar APK como Release (descarga directa)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="App Android de FAST-E.R. — funciona 100% offline (toda la herramienta va dentro del APK).

          Instalación (sideload):
          1) Descarga FAST-ER.apk.
          2) Ábrelo en el teléfono y permite \"Instalar apps de fuentes desconocidas\".
          3) Instala. Aparece la app FAST-E.R.

          Nota: APK de depuración (firmado con clave debug); Android puede advertir que es de un desarrollador desconocido."
          gh release create android-latest FAST-ER.apk \
            --title "FAST-E.R. — App Android (última APK)" \
            --notes "$NOTES" \
            --latest \
          || gh release upload android-latest FAST-ER.apk --clobber
